# ---------------------------------------------------------------------------
# solutions — high-level solution areas an item advances.
#
# A subset of these are official Red Hat Technology Decision Points (TDPs),
# marked below. The others are solution areas that don't map to a TDP.
# This distinction is informational — it does not change normalization.
# Post-analysis alias snap only, NOT injected into the prompt.
# ---------------------------------------------------------------------------
solutions:
  # TDPs (official Red Hat Technology Decision Points)
  - name: Application Platform
    aliases: [ApplicationPlatform, Application Development, ApplicationDevelopment]
    is_tdp: true
  - name: Automation
    aliases: [Mission Critical IT Automation, ProcessAutomation, Process Automation]
    is_tdp: true
  - name: Container Management
    aliases: [ContainerManagement, Multicluster Management]
    is_tdp: true
  - name: Virtualization
    aliases: []
    is_tdp: true
  - name: AI
    aliases: [AI Platform, AI/ML, AI ML, Machine Learning]
    is_tdp: true
  - name: Operating System
    aliases: [OperatingSystem, Cloud Operating System]
    is_tdp: true

  # Non-TDP solution areas
  - name: Integration
    aliases: [Integration & Messaging, Messaging]
  - name: Security
    aliases: [Security & Compliance, Compliance]
  - name: Sovereignty
    aliases: [Digital Sovereignty, Data Sovereignty, Cloud Sovereignty]
  - name: Edge
    aliases: []
  - name: Data Services & Storage
    aliases: [Storage, Data Services]

# ---------------------------------------------------------------------------
# verticals — industry verticals.
# Post-analysis alias snap only, NOT injected into the prompt.
# ---------------------------------------------------------------------------
verticals:
  # "All" is a meta-value meaning "industry-agnostic" — the null case, not an
  # actual industry. Empty/missing vertical normalizes to this.
  - name: All
    aliases: []
  - name: Financial Services
    aliases: [FSI, Financial Services Industry]
  - name: Telco
    aliases: [Telecommunications]
  - name: Retail
    aliases: []
  - name: Healthcare
    aliases: []
  - name: Government
    aliases: [Public Sector]
  - name: Manufacturing
    aliases: [Industrial]
  - name: Utility
    aliases: [Utilities, Energy]

# ---------------------------------------------------------------------------
# platforms — deployment target. What the content demonstrates deploying ONTO.
#
# DISTINCT from Babylon cloud_provider (where infrastructure is provisioned).
# A lab with cloud_provider=azure might deploy VMs, not ARO. A lab with
# cloud_provider=azure and platform=On-Premise is valid (Azure-provisioned
# lab demonstrating on-prem patterns). No mapping between the two.
#
# Applies to all content types (Babylon and OSSPA).
# Post-analysis alias snap only, NOT injected into the prompt.
# ---------------------------------------------------------------------------
platforms:
  - name: On-Premise
    aliases: [on-prem, on_premise, on premise, on-premises, on_premises]
  - name: AWS
    aliases: [Amazon Web Services]
  - name: Azure
    aliases: [Microsoft Azure]
  - name: Cloud
    aliases: []
  - name: Edge
    aliases: []

# ---------------------------------------------------------------------------
# topics — NOT ENUMERATED. Fully open dimension.
#
# The LLM generates as many specific topic phrases as the content warrants.
# No count cap. No enumerated list. Format guidance only: short phrases
# (2-4 words each), not sentences.
#
# Post-analysis: squash-key dedup collapses spelling variants of the same topic
# on the same item (casefold + strip non-alphanumerics; longest original form
# survives, ties broken by first appearance). No flagging.
# ---------------------------------------------------------------------------
# (no topics list — this comment documents the design decision)

# ---------------------------------------------------------------------------
# audience — two sub-dimensions, both fully open.
#
# target_audience: who the content is FOR (external consumers)
#   Examples: platform engineers, developers, data scientists, ml engineers,
#   application developers, devops engineers, site reliability engineers,
#   security engineers, system administrators, IT decision makers
#
# recommender_audience: who at Red Hat should know about this content
#   Examples: solution architects, consultants, TAMs, field engineers,
#   account executives, partner engineers
#
# Both are open — no flagging, no normalization. These are seed examples
# for the LLM prompt, not a closed list.
# ---------------------------------------------------------------------------
# (no audience list — seed examples are in the comment above and in the
#  analysis prompt templates)

# ---------------------------------------------------------------------------
# difficulty — closed set. Post-analysis alias snap only.
# Normalization is case-insensitive. Aliases handle common variants.
# ---------------------------------------------------------------------------
difficulty:
  - name: beginner
    aliases: [introductory, basic, beginner-level, entry-level]
  - name: intermediate
    aliases: [moderate, intermediate-level]
  - name: advanced
    aliases: [expert, advanced-level]

# ---------------------------------------------------------------------------
# Action verbs — organized by content mode.
#
# Different content types have different measurability criteria:
#   hands_on:     labs, sandboxes — verify via observable state change
#   read_through: reference architectures — verify via identifiable output
#   interactive:  interactive demos (future) — verify via guided completion
#
# A verb is "measurable" if completion can be verified through an observable
# artifact or state change, not an internal cognitive state. Aligns with
# Bloom's taxonomy: Apply-Create for hands-on, Analyze-Evaluate for
# read-through.
#
# The rejected list is the same everywhere — non-measurable cognitive-state
# verbs are non-measurable regardless of content format.
# ---------------------------------------------------------------------------
action_verbs:
  hands_on:
    valid:
      - configure
      - deploy
      - create
      - build
      - install
      - implement
      - integrate
      - automate
      - manage
      - scale
      - troubleshoot
      - monitor
      - observe
      - migrate
      - secure
      - provision
      - verify
      - diagnose
      - validate
      - design
    rejected: &rejected_verbs
      - understand
      - learn
      - know
      - be familiar with
      - appreciate
      - become aware
      - realize
      - recognize

  read_through:
    valid:
      - compare
      - evaluate
      - assess
      - identify
      - distinguish
      - review
      - classify
      - diagram
      - summarize
      - contrast
      - analyze
    rejected: *rejected_verbs

  interactive:
    valid:
      - navigate
      - interact
      - follow
      - demonstrate
      - observe
      - complete
      - select
      - submit
      - verify
    rejected: *rejected_verbs

# ---------------------------------------------------------------------------
# content_modes — maps content_entities.content_type to an action_verbs mode.
#
# Keys off content_entities.content_type (derived deterministically at catalog
# refresh from Babylon category + showroom_url presence; set to 'architecture'
# by OSSPA ingest), NOT the LLM's self-reported content_type — the verb hint is
# rendered into the prompt before the model has responded.
#
# Unmapped content types fall back to hands_on with a logged warning.
# ---------------------------------------------------------------------------
content_modes:
  lab: hands_on
  demo: hands_on
  sandbox: hands_on
  architecture: read_through

# ---------------------------------------------------------------------------
# ignored_terms — terms an admin has rejected via the vocabulary queue.
#
# These are real strings the LLM emits that are NOT products (or solutions,
# etc.) and never will be. Listing them here stops them being re-recorded in
# the unknown-terms queue on every scan. Round-trips through the generator.
# ---------------------------------------------------------------------------
ignored_terms:
  products: [Kubernetes, Linux, YAML, Git, Docker, Prometheus, Grafana]
  solutions: []
  verticals: []
  platforms: []
  difficulty: []
