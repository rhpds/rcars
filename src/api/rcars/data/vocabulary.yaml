# vocabulary.yaml — controlled vocabulary shared by all content analyzers
#
# Source of truth for the terms RCARS analysis should prefer when tagging
# content (Babylon labs AND OSSPA architectures). Deliberately source-agnostic
# so both converge on the same terms over time.
#
# Owned by the Controlled Vocabulary design spec:
#   docs/superpowers/specs/2026-08-10-controlled-vocabulary-design.md
#
# DESIGN INTENT (per Nate, 2026-08-06):
#   This list exists to NORMALIZE — collapse near-duplicate product names,
#   solution areas, and learning-objective verbs so triage/Browse/similarity
#   stay consistent across sources. It is NOT meant to cage the LLM's ability
#   to detect fine-grained topics.
#
# How it is used:
#   1. Loaded once per process by rcars/services/vocabulary.py (@lru_cache).
#   2. ONLY products are injected into the analysis prompt. The model is told
#      to PREFER a listed product name and only coin a new one when nothing
#      matches. All other dimensions stay OUT of the prompt.
#   3. A post-analysis normalization pass snaps aliases to canonical forms
#      (exact match, case-insensitive) and deduplicates topics (fuzzy).
#
# To update: edit this file, open a PR, merge. Ops can override
# per-environment via the mounted ConfigMap without an image rebuild.
#
# Grounding sources: Publishing House ph-validation-policy; RCARS
# data/product-terms.yaml + data/workload_mapping.yaml; and the live OSSPA
# PAList.csv Product/Solutions/Vertical/Platform columns.

# ---------------------------------------------------------------------------
# products — official Red Hat product names, each with the aliases/acronyms
# and OSSPA short-forms that should normalize to it.
#
# THIS IS THE ONLY DIMENSION INJECTED INTO THE LLM PROMPT.
# All other dimensions are post-analysis normalization only.
# ---------------------------------------------------------------------------
