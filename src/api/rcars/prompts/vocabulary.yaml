# vocabulary.yaml — controlled vocabulary shared by all content analyzers
#
# Source of truth for the terms RCARS analysis should prefer when tagging
# content (Babylon labs AND OSSPA architectures). Deliberately source-agnostic
# so both converge on the same terms over time. See design spec §3g
# (docs/superpowers/specs/2026-08-06-rcars-oppsa-injestion.md).
#
# DESIGN INTENT (per Nate, 2026-08-06):
#   This list exists to NORMALIZE — collapse near-duplicate product names,
#   solution areas, and learning-objective verbs so triage/Browse/similarity
#   stay consistent across sources. It is NOT meant to cage the LLM's ability
#   to detect fine-grained topics. Keep `topics` BROAD; let the model coin
#   specific topics on its own (e.g. "web search augmentation") — do not try to
#   enumerate every niche capability here.
#   (The OSSPA PAList.csv `metaKeyword` column proves the point: 186 distinct
#    keywords, almost all one-offs like "granite 3.2 8b instruct" — never codify.)
#
# How it is used:
#   1. Loaded once per process by rcars/services/vocabulary.py (@lru_cache).
#   2. Interpolated into the analysis prompts (architecture_analyze.txt and
#      analyze_showroom.txt). The model is told to PREFER a listed term where
#      one fits and only coin a new term when nothing matches.
#   3. A post-analysis normalization pass snaps obvious near-misses (and
#      aliases) to the canonical form before write.
#
# Layout mirrors the Publishing House ph-validation-policy ConfigMap: products
# (and solutions) carry {name, aliases}; learning-objective verbs are split into
# valid / rejected. To update: edit this file, open a PR, merge. Ops can
# override per-environment via the mounted ConfigMap without an image rebuild.
#
# Grounding sources: Publishing House ph-validation-policy; RCARS
# data/product-terms.yaml + data/workload_mapping.yaml; and the live OSSPA
# PAList.csv Product/Solutions/Vertical/Platform columns (39 in-scope rows).

# ---------------------------------------------------------------------------
# products — official Red Hat product names, each with the aliases/acronyms
# and OSSPA short-forms that should normalize to it.
# ---------------------------------------------------------------------------
products:
  - name: Red Hat OpenShift Container Platform
    aliases: [OpenShift, OCP]
  - name: Red Hat Ansible Automation Platform
    aliases: [AAP, Ansible]
  - name: Red Hat OpenShift AI
    aliases: [RHOAI, OpenShift AI, Red Hat AI]
  - name: Red Hat Advanced Cluster Management
    aliases: [RHACM, ACM]
  - name: Red Hat Advanced Cluster Security
    aliases: [RHACS, ACS, StackRox]
  - name: Red Hat Developer Hub
    aliases: [RHDH, Developer Hub]
  - name: Red Hat Quay
    aliases: [Quay]
  - name: Red Hat OpenShift GitOps
    aliases: [GitOps, ArgoCD, Argo CD]
  - name: Red Hat OpenShift Pipelines
    aliases: [Pipelines, Tekton]
  - name: Red Hat OpenShift Virtualization
    aliases: [OpenShift Virtualization, CNV, KubeVirt]
  - name: Red Hat OpenShift Data Foundation
    aliases: [ODF, Data, Storage]
  - name: Red Hat OpenShift Service Mesh
    aliases: [Service Mesh, Istio, OSSM]
  - name: Red Hat OpenShift Serverless
    aliases: [Serverless, Knative]
  - name: Red Hat Enterprise Linux
    aliases: [RHEL, RHEL for SAP Solutions]
  - name: Red Hat Hardened Images
    aliases: [RHHI]
  - name: Red Hat build of Keycloak
    aliases: [Keycloak, RHSSO, SSO, RHBK]
  - name: Red Hat Trusted Profile Analyzer
    aliases: [TPA]
  - name: Red Hat Trusted Artifact Signer
    aliases: [TAS, RHTAS]
  - name: Red Hat Satellite
    aliases: [Satellite]
  - name: Red Hat Lightwell
    aliases: [Lightwell, Lightwell Network]
  - name: Red Hat OpenShift Lightspeed
    aliases: [OpenShift Lightspeed, OLS]
  - name: Red Hat OpenShift Service on AWS
    aliases: [ROSA]
  - name: Azure Red Hat OpenShift
    aliases: [ARO, Azure OpenShift]
  - name: Single Node OpenShift
    aliases: [SNO]
  - name: Red Hat OpenShift Dev Spaces
    aliases: [Dev Spaces, DevSpaces, CodeReady Workspaces, CRW]
  - name: Red Hat OpenShift Builds
    aliases: [Builds, Shipwright]
  - name: Migration Toolkit for Virtualization
    aliases: [MTV]
  - name: Red Hat AMQ Streams
    aliases: [AMQ, Kafka]
  - name: Red Hat 3scale API Management
    aliases: [3scale, API]
  - name: Event-Driven Ansible
    aliases: [EDA]
  - name: NVIDIA GPU Operator
    aliases: [GPU Operator]
  - name: cert-manager Operator for Red Hat OpenShift
    aliases: [cert-manager]
  - name: Red Hat Insights
    aliases: [Insights]
  - name: Red Hat OpenStack Services on OpenShift
    aliases: [OpenStack, RHOSO]
  - name: Red Hat Application Foundations
    # OSSPA "Runtimes" is the former name of this middleware/integration bundle;
    # the two tokens co-occur and normalize to one product.
    aliases: [Application Foundations, Runtimes, Red Hat Runtimes]
  - name: Red Hat Identity Management
    # OSSPA "Identity" is used loosely: mostly infra identity (IdM/FreeIPA) in
    # telco/5G/cloud rows, occasionally app SSO (Keycloak) in AI/API rows.
    # Mapped to IdM as the dominant sense — revisit if SSO cases grow.
    aliases: [Identity, IdM, FreeIPA]

  # NOTE: OSSPA "Consulting" and "Training" are SERVICES, not products —
  # intentionally excluded from this list.

# ---------------------------------------------------------------------------
# solutions — high-level solution areas an item advances. Maps to
# architecture_analysis.solution_areas_json AND portfolio_architectures.solutions.
# Anchored on the OSSPA PAList `Solutions` taxonomy; aliases collapse the
# CamelCase / spacing / marketing variants seen in the real data.
# ---------------------------------------------------------------------------
solutions:
  - name: Application Platform
    aliases: [ApplicationPlatform, Application Development, ApplicationDevelopment]
  - name: Automation
    aliases: [Mission Critical IT Automation, ProcessAutomation, Process Automation]
  - name: Container Management
    aliases: [ContainerManagement, Multicluster Management]
  - name: Virtualization
    aliases: []
  - name: AI
    aliases: [AI Platform, AI/ML, AI ML, Machine Learning]
  - name: Operating System
    aliases: [OperatingSystem, Cloud Operating System]
  - name: Integration
    aliases: [Integration & Messaging, Messaging]
  - name: Security
    aliases: [Security & Compliance, Compliance]
  - name: Sovereignty
    aliases: [Digital Sovereignty, Data Sovereignty, Cloud Sovereignty]
  - name: Edge
    aliases: []
  - name: Data Services & Storage
    aliases: [Storage, Data Services]

# ---------------------------------------------------------------------------
# verticals — industry verticals. Maps to portfolio_architectures.verticals.
# Closed set derived from the OSSPA PAList `Vertical` column; canonical names
# are human-readable, with the CSV short-forms as aliases. "All"
# (industry-agnostic) is the default when no specific vertical applies.
# ---------------------------------------------------------------------------
verticals:
  - name: All
    aliases: []
  - name: Financial Services
    aliases: [FSI, Financial Services Industry]
  - name: Telco
    aliases: [Telecommunications]
  - name: Retail
    aliases: []
  - name: Healthcare
    aliases: []
  - name: Government
    aliases: [Public Sector]
  - name: Manufacturing
    aliases: [Industrial]
  - name: Utility
    aliases: [Utilities, Energy]

# ---------------------------------------------------------------------------
# platforms — deployment target. OSSPA-native (PAList `Platform` column); the
# LLM is not asked to generate these, but canonical forms aid normalization.
# ---------------------------------------------------------------------------
platforms:
  - On-Premise
  - AWS
  - Azure
  - Cloud
  - Edge

# ---------------------------------------------------------------------------
# topics — BROAD topic areas only (see DESIGN INTENT above). This is a light
# guide, not an exhaustive taxonomy. The LLM is expected to add its own, more
# specific topics beyond this list — do not codify niche capabilities here.
# ---------------------------------------------------------------------------
topics:
  - gitops
  - ci-cd
  - kubernetes-operators
  - service-mesh
  - serverless
  - observability
  - security
  - compliance
  - authentication
  - virtualization
  - storage
  - high-availability
  - disaster-recovery
  - business-continuity
  - ai-ml
  - model-serving
  - automation
  - infrastructure-as-code
  - api-management
  - messaging
  - multicluster-management
  - multitenancy
  - edge
  - hybrid-cloud
  - data-sovereignty
  - developer-experience
  - supply-chain-security
  - networking

# ---------------------------------------------------------------------------
# audience — target audience descriptors (ROLES). Distinct from difficulty.
# Open-ended; seed set only.
# ---------------------------------------------------------------------------
audience:
  - platform engineers
  - developers
  - application developers
  - devops engineers
  - site reliability engineers
  - security engineers
  - data scientists
  - ml engineers
  - system administrators
  - solution architects
  - IT decision makers
  - automation engineers

# ---------------------------------------------------------------------------
# difficulty — closed set. Snap any near-miss to one of these.
# ---------------------------------------------------------------------------
difficulty:
  - beginner
  - intermediate
  - advanced

# ---------------------------------------------------------------------------
# Learning-objective verbs (Babylon labs). Not requested for OSSPA
# architectures in Phase 1; lives here for the shared Babylon analyzer.
# Mirrors the Publishing House valid/rejected split — rejected verbs are
# non-measurable and should be flagged/replaced.
# ---------------------------------------------------------------------------
action_verbs_valid:
  - configure
  - deploy
  - create
  - implement
  - troubleshoot
  - monitor
  - scale
  - install
  - build
  - integrate
  - automate
  - manage
  - observe
  - migrate
  - secure
  - provision
  - verify
  - demonstrate
  - explore
  - analyze

action_verbs_rejected:
  - understand
  - learn
  - know
  - be familiar with
  - appreciate
  - become aware
  - realize
  - recognize
